y="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="524" y="374">~ geminiService : GeminiService</text><line stroke="#CAD6E3" stroke-width="1.2" x1="503" x2="996" y1="397" y2="397" /><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="524" y="431">+ hello() : String</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="524" y="471">+ translate(body : String) : Response</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="524" y="511">- error(status : int, message : String) : Response</text><line stroke="#CAD6E3" stroke-width="1.2" x1="503" x2="996" y1="540" y2="540" /><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="524" y="573">@Path("/translator")  ·  @Inject</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="524" y="600">GET /hello   |   POST /translate</text><rect fill="#FFFFFF" height="374" rx="15" ry="15" stroke="#CAD6E3" stroke-width="1.2" width="421" x="1064" y="266" /><rect fill="#14253F" height="76" rx="14" ry="14" width="419" x="1065" y="267" /><rect fill="#14253F" height="20" width="419" x="1065" y="323" /><text fill="#B7CBE9" font-family="Inter, DejaVu Sans, sans-serif" font-size="11" font-weight="700" text-anchor="start" x="1083" y="292">«APPLICATION-SCOPED SERVICE»</text><text fill="#FFFFFF" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="1083" y="325">GeminiService</text><line stroke="#CAD6E3" stroke-width="1.2" x1="1064" x2="1485" y1="344" y2="344" /><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1083" y="371">- client : HttpClient</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1083" y="402">- MAX_RETRIES : int = 2</text><line stroke="#CAD6E3" stroke-width="1.2" x1="1064" x2="1485" y1="426" y2="426" /><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="1083" y="465">+ translate(text : String) : String</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1083" y="502">- sendWithRetries(...) : HttpResponse</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1083" y="539">- logUpstreamError(...) : void</text><line stroke="#CAD6E3" stroke-width="1.2" x1="1064" x2="1485" y1="567" y2="567" /><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1083" y="598">Gemini generateContent  ·  UTF-8</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1083" y="623">Retries: 429, 503, timeout</text><line stroke="#2874DC" stroke-width="2.4" x1="996" x2="1064" y1="420" y2="420" /><polygon fill="#2874DC" points="1064,420 1054.0013767535763,424.5855788267213 1054.0013767535763,415.4144211732787" /><text fill="#2874DC" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle" x="1032" y="398">@Inject</text><rect fill="#E9F7F5" height="116" rx="15" ry="15" stroke="#97CBC7" stroke-width="1.2" width="388" x="1096" y="684" /><text fill="#0D8E87" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start" x="1117" y="711">«STATIC NESTED EXCEPTION»</text><text fill="#14253F" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="1117" y="746">TranslationException</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="1117" y="777">- status : int   |   + getStatus() : int</text><line stroke="#0D8E87" stroke-dasharray="7,6" stroke-width="2" x1="1295" x2="1295" y1="640" y2="682" /><polygon fill="#0D8E87" points="1295,682 1290.4144211732787,672.0013767535762 1299.5855788267213,672.0013767535762" /><text fill="#0D8E87" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="start" x="1310" y="667">throws / owns</text><rect fill="#EAF3FF" height="122" rx="12" ry="12" stroke="#B9D4F3" stroke-width="1.2" width="492" x="504" y="677" /><text fill="#2874DC" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start" x="524" y="708">RESPONSIBILITY</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="524" y="739">Validate input, invoke GeminiService,</text><text fill="#22344D" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="524" y="765">map exceptions to JSON HTTP errors.</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start" x="524" y="790">Security is enforced by WildFly, not this class.</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="91" y="874">Notation: + public  ·  - private  ·  ~ package-private  ·  dotted edge = nested exception</text></svg>