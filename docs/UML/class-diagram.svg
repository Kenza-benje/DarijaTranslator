<svg baseProfile="full" height="922" version="1.1" viewBox="0 0 1610 922" width="1610" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7F9FC" height="922" width="1610" x="0" y="0" /><rect fill="#2874DC" height="9" width="1610" x="0" y="0" /><text fill="#2874DC" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="800" letter-spacing="2" x="75" y="52">01 · STATIC STRUCTURE</text><text fill="#14253F" font-family="Inter, DejaVu Sans, sans-serif" font-size="34" font-weight="800" x="75" y="101">Class diagram</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" x="75" y="131">Actual Java 17 / Jakarta REST implementation  •  application code only</text><rect fill="#FFFFFF" height="665" rx="18" ry="18" stroke="#CFDBE8" stroke-width="1.2" width="1462" x="74" y="167" /><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" font-weight="700" text-anchor="start" x="103" y="202">MODEL</text><text fill="#14253F" font-family="Inter, DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" x="203" y="203">com.darijatranslator  +  external Jakarta REST base type</text><line stroke="#CAD6E3" stroke-width="1.2" x1="99" x2="1510" y1="223" y2="223" /><rect fill="#F0F4F9" height="116" rx="15" ry="15" stroke="#CAD6E3" stroke-width="1.2" width="319" x="116" y="264" /><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start" x="134" y="292">«jakarta.ws.rs.core»</text><text fill="#14253F" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="134" y="331">Application</text><text fill="#5A6A7F" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start" x="134" y="357">framework base class</text><rect fill="#FFFFFF" height="179" rx="15" ry="15" stroke="#CA