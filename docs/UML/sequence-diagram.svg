="2" x1="592" x2="592" y1="270" y2="1465" /><rect fill="#FFFFFF" height="67" rx="12" ry="12" stroke="#90B3DB" stroke-width="2" width="210" x="730" y="202" /><text fill="#142846" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" x="835" y="244">PHP server</text><line stroke="#C9D7E6" stroke-dasharray="8,7" stroke-width="2" x1="835" x2="835" y1="270" y2="1465" /><rect fill="#FFFFFF" height="67" rx="12" ry="12" stroke="#90B3DB" stroke-width="2" width="210" x="975" y="202" /><text fill="#142846" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" x="1080" y="244">WildFly</text><line stroke="#C9D7E6" stroke-dasharray="8,7" stroke-width="2" x1="1080" x2="1080" y1="270" y2="1465" /><rect fill="#FFFFFF" height="67" rx="12" ry="12" stroke="#90B3DB" stroke-width="2" width="210" x="1225" y="202" /><text fill="#142846" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" x="1330" y="244">REST Resource</text><line stroke="#C9D7E6" stroke-dasharray="8,7" stroke-width="2" x1="1330" x2="1330" y1="270" y2="1465" /><rect fill="#FFFFFF" height="67" rx="12" ry="12" stroke="#90B3DB" stroke-width="2" width="210" x="1495" y="202" /><text fill="#142846" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" x="1600" y="244">GeminiService</text><line stroke="#C9D7E6" stroke-dasharray="8,7" stroke-width="2" x1="1600" x2="1600" y1="270" y2="1465" /><rect fill="#FFFFFF" height="67" rx="12" ry="12" stroke="#90B3DB" stroke-width="2" width="210" x="1805" y="202" /><text fill="#142846" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" x="1910" y="244">Gemini API</text><line stroke="#C9D7E6" stroke-dasharray="8,7" stroke-width="2" x1="1910" x2="1910" y1="270" y2="1465" /><rect fill="#F5FBFE" height="290" rx="14" ry="14" stroke="#D6E8F1" stroke-width="1" width="2082" x="34" y="293" /><text fill="#0D9488" font-family="DejaVu Sans" font-size="19" font-weight=