xt-anchor="start" x="620" y="560">Alternative: typed English or selected webpage text enters at the Browser UI</text><rect fill="#F7FAFE" height="250" rx="14" ry="14" stroke="#D6E8F1" stroke-width="1" width="2082" x="34" y="598" /><text fill="#2563EB" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="55" y="629">TRANSPORT   /   choose the active client path</text><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="122" x2="122" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="357" x2="357" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="592" x2="592" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="835" x2="835" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1080" x2="1080" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1330" x2="1330" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1600" x2="1600" y1="632" y2="836" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1910" x2="1910" y1="632" y2="836" /><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="357" x2="835" y1="680" y2="680" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="596.0" y="668">PHP page → local PHP server</text><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="835" x2="1080" y1="727" y2="727" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="957.5" y="715">PHP → WildFly: POST + Basic + JSON</text><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="357" x2="1080" y1="797" y2="797" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="718.5" y="785">OR Chrome extension → WildFly directly</text><rect fill="#F6FCFB" height="366" rx="14" ry="14" stroke="#D0E7E4" stroke-width="1" width="2082" x="34" y="869" /><text fill="#0D9488" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="55" y="900">SERVER PROCESSING   /   on successful authentication and valid JSON</text><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="122" x2="122" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="357" x2="357" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="592" x2="592" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="835" x2="835" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1080" x2="1080" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1330" x2="1330" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1600" x2="1600" y1="909" y2="1218" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1910" x2="1910" y1="909" y2="1218" /><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="1080" x2="1330" y1="945" y2="945" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="1205.0" y="933">Authorize / dispatch POST</text><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="1330" x2="1600" y1="1012" y2="1012" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="1465.0" y="1000">translate(text)</text><line marker-end="url(#arr)" stroke="#2563EB" stroke-width="2.6" x1="1600" x2="1910" y1="1085" y2="1085" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="1755.0" y="1073">HTTPS generateContent</text><line marker-end="url(#arr)" stroke="#0D9488" stroke-width="2.6" x1="1910" x2="1600" y1="1157" y2="1157" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="1755.0" y="1145">200 + Darija text (or retry if transient)</text><rect fill="#F8FCFE" height="175" rx="14" ry="14" stroke="#D6E8F1" stroke-width="1" width="2082" x="34" y="1259" /><text fill="#2563EB" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="start" x="55" y="1290">RESPONSE   /   written output only</text><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="122" x2="122" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="357" x2="357" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="592" x2="592" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="835" x2="835" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1080" x2="1080" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1330" x2="1330" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1600" x2="1600" y1="1295" y2="1420" /><line stroke="#CBD7E3" stroke-dasharray="8,7" stroke-width="1" x1="1910" x2="1910" y1="1295" y2="1420" /><line marker-end="url(#arr)" stroke="#0D9488" stroke-width="2.6" x1="1600" x2="1330" y1="1325" y2="1325" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="1465.0" y="1313">Return translation</text><line marker-end="url(#arr)" stroke="#0D9488" stroke-width="2.6" x1="1330" x2="357" y1="1370" y2="1370" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="843.5" y="1358">HTTP 200 + JSON (via PHP if needed)</text><line marker-end="url(#arr)" stroke="#0D9488" stroke-width="2.6" x1="357" x2="122" y1="1410" y2="1410" /><text fill="#56677C" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="middle" x="239.5" y="1398">Display written Darija / Copy</text><rect fill="#FFFFFF" height="84" rx="11" ry="11" stroke="#D6E1EC" stroke-width="1" width="2070" x="40" y="1482" /><text fill="#2563EB" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="start" x="64" y="1515">ALTERNATIVES</text><text fill="#56677C" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="235" y="1515">Mic denied / unsupported → message; invalid credentials → 401/403; bad text → 400; Gemini error → JSON error.</text><text fill="#56677C" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start" x="235" y="1542">Transient Gemini failures may be retried up to 2 times. No TTS or Read Aloud.</text></svg>